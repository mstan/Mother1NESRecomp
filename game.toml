# Mother 1 / EarthBound Zero (NES) -- NESRecomp configuration
#
# iNES header:
#   Mapper 4 / MMC3
#   16 x 16 KiB PRG ROM banks
#   32 x 8 KiB CHR ROM banks
#   Battery-backed SRAM

[game]
name = "Mother 1"
output_prefix = "mother1"

# Keep the 6502 stack mirrored for interpreter fallback on missed dispatches.
push_all_jsr = true

